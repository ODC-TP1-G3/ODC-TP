name: CI Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch: # permet le déclenchement manuel du pipeline

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install || echo "No package.json, skipping install"

      - name: Run tests
        run: npm test || echo "No tests found, skipping"

      - name: Build project
        run: echo "Build passed"  # remplacer par ta commande de build si nécessaire

      - name: SonarQube Analysis
        uses: sonarsource/sonarcloud-github-action@v2
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=ODC-TP1-G3
            -Dsonar.organization=your-org
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  docker_build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build Docker image
        run: |
          docker build -t odc-tp-image:latest .

  deploy_manual:
    name: Deploy (Manual)
    runs-on: ubuntu-latest
    needs: docker_build
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Manual deployment step
        run: echo "Déploiement manuel à réaliser ici"
