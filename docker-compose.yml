services:

  db:
    image: mysql:8
    container_name: prisma_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: appdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: prisma_backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: mysql://root:password@db:3306/appdb
    ports:
      - "4000:4000"

volumes:
  mysql_data: